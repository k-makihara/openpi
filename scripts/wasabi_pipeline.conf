# Wasabi -> OpenPI training -> Wasabi upload pipeline settings
# Keep credentials out of this file. Use environment variables or an AWS profile.

# ---- Local paths ------------------------------------------------------------

OPENPI=/fsx/koshi.makihara/openpi

RAW_ROOT=/fsx/koshi.makihara/datasets/lerobot_v21_ph2_PickAndPlace/umi_yubi_1
WORK_ROOT=/fsx/koshi.makihara/datasets_tasked/wasabi_runs

# ---- Wasabi paths -----------------------------------------------------------

ENDPOINT=https://s3.ap-northeast-1.wasabisys.com

# Change these if the actual Wasabi directory layout is different.
REMOTE_ROOT=s3://yubi-data/tmc_assembly
MODEL_ROOT=s3://yubi-data/tmc_assembly/models

# ---- Input datasets ---------------------------------------------------------

DATASETS=(
  # lerobot_v21_ph2_success_umi_yubi_1_20260622
  # lerobot_v21_ph2_success_umi_yubi_1_20260618
  # lerobot_v21_ph2_success_umi_yubi_1_20260616
  # lerobot_v21_ph2_success_umi_yubi_1_20260615
  # lerobot_v21_ph2_success_umi_yubi_1_20260612
  lerobot_v21_ph2_success_20260917_AssemblyECU/
)

# ---- Task annotation --------------------------------------------------------
#
# TASK_MODE=single    : give every episode the same task instruction.
# TASK_MODE=tasks-txt : read each dataset's tasks.txt.

TASK_MODE=single
TASK='Sort the 15 types of industrial parts'

# ---- OpenPI config ----------------------------------------------------------

BASE_CONFIG=pi05_umi_original_dual_arm_relative_state_hz30_h32_bs32_30k_assemblyecu_singleinst_v2
CONFIG_PREFIX=pi05_umi_pickandplace_yubi1_hz30_h32

# Typical progression: 30,000 -> 60,000 -> 100,000
NUM_TRAIN_STEPS=30000
BATCH_SIZE=32

# ---- Slurm resources --------------------------------------------------------

PARTITION=dev
GRES=gpu:h200:8
TIME_LIMIT=24:00:00
